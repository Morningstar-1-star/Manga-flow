name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Restore or generate keystores
      run: |
        # Restore debug.keystore from base64 if present
        if [ -f debug.keystore.base64 ]; then
          tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore || true
        fi

        # Fallback: Generate debug.keystore if missing or empty
        if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
          echo "Generating new debug.keystore..."
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
        fi

        # Generate dummy my-upload-key.jks for release config fallback if missing
        if [ ! -f my-upload-key.jks ]; then
          echo "Generating dummy my-upload-key.jks..."
          keytool -genkeypair -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload Key, O=Android, C=US"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Manga-flow-debug
        path: app/build/outputs/apk/debug/*.apk

